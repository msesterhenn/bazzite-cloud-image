name: Build Container Image

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .github/workflows/build-container.yml
  schedule:
    # Weekly rebuild to pick up upstream Bazzite updates
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      base_image:
        description: "Bazzite variant (base image)"
        required: false
        default: "bazzite-nvidia-open"
        type: choice
        options:
          - bazzite
          - bazzite-nvidia
          - bazzite-nvidia-open
          - bazzite-gnome
          - bazzite-gnome-nvidia
          - bazzite-gnome-nvidia-open

env:
  IMAGE_NAME: bazzite-cloud-image
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  BASE_IMAGE_DEFAULT: bazzite-nvidia-open

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set-matrix.outputs.variants }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variants=[\"${{ github.event.inputs.base_image }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["bazzite","bazzite-nvidia","bazzite-nvidia-open","bazzite-gnome","bazzite-gnome-nvidia","bazzite-gnome-nvidia-open"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize disk space
        uses: ublue-os/remove-unwanted-software@v9
        with:
          remove-codeql: true

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Determine base image URI
        id: base
        run: |
          BASE_URI="ghcr.io/ublue-os/${{ matrix.variant }}:stable"
          echo "uri=${BASE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          IMAGE_TAG=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }}
          podman build --build-arg BASE_IMAGE=${{ steps.base.outputs.uri }} -t "${IMAGE_TAG}" .

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push to GHCR
        run: |
          IMAGE_TAG=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }}
          podman push "${IMAGE_TAG}"

      - name: Push latest tag for default variant
        if: matrix.variant == env.BASE_IMAGE_DEFAULT
        run: |
          IMAGE_TAG=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }}
          podman tag "${IMAGE_TAG}" ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          podman push ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Push dated tag
        run: |
          DATE_TAG=$(date +%Y%m%d)
          IMAGE_DATED=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }}-${DATE_TAG}
          podman tag ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }} "${IMAGE_DATED}"
          podman push "${IMAGE_DATED}"
