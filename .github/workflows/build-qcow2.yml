name: Build QCOW2 Disk Image

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Bazzite variant (container image tag)"
        required: false
        default: "bazzite-nvidia-open"
        type: choice
        options:
          - bazzite
          - bazzite-nvidia
          - bazzite-nvidia-open
          - bazzite-gnome
          - bazzite-gnome-nvidia
          - bazzite-gnome-nvidia-open
  workflow_run:
    workflows: ["Build Container Image"]
    types: [completed]
    branches: [main]

env:
  IMAGE_NAME: bazzite-cloud-image
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      variants: ${{ steps.set-matrix.outputs.variants }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variants=[\"${{ github.event.inputs.variant }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["bazzite","bazzite-nvidia","bazzite-nvidia-open","bazzite-gnome","bazzite-gnome-nvidia","bazzite-gnome-nvidia-open"]' >> "$GITHUB_OUTPUT"
          fi

  build-qcow2:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-utils

      - name: Maximize disk space
        uses: ublue-os/remove-unwanted-software@v9
        with:
          remove-codeql: true

      - name: Free additional disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup \
            /usr/share/dotnet /usr/share/swift /usr/share/az* \
            /opt/ghc /opt/az* /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull container image into rootful storage
        run: |
          IMAGE_URI=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }}
          sudo podman pull "${IMAGE_URI}"

      - name: Build QCOW2 with bootc-image-builder
        run: |
          IMAGE_URI=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }}
          mkdir -p output
          sudo podman run --rm -it \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage:Z \
            -v $(pwd)/image.toml:/config.toml:Z \
            -v $(pwd)/output:/output:Z \
            -e TMPDIR=/tmp \
            ${{ env.BIB_IMAGE }} \
            --type qcow2 \
            --rootfs btrfs \
            --chown $(id -u):$(id -g) \
            "${IMAGE_URI}"

      - name: Compress QCOW2 and free intermediate space
        run: |
          qemu-img convert -O qcow2 -c output/qcow2/disk.qcow2 output/bazzite-cloud-image.qcow2
          rm -f output/qcow2/disk.qcow2

      - name: Generate checksum
        run: |
          cd output
          sha256sum bazzite-cloud-image.qcow2 > bazzite-cloud-image.qcow2.sha256

      - name: Upload QCOW2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-cloud-image-${{ matrix.variant }}-qcow2
          path: output/bazzite-cloud-image.qcow2
          retention-days: 30

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-cloud-image-${{ matrix.variant }}-checksum
          path: output/bazzite-cloud-image.qcow2.sha256
          retention-days: 30

