# In image mode, the host root filesystem is mounted at /sysroot, not /.
# That is the one we should attempt to resize, not what is mounted at /,
# which is a composefs overlay with no backing block device.
#
# This mirrors the upstream Fedora bootc example:
# https://gitlab.com/fedora/bootc/examples/-/blob/main/cloud-init/10_bootc.cfg
#
# growpart grows the partition. resize_rootfs is disabled because cloud-init
# cannot grow the filesystem here (https://issues.redhat.com/browse/RHEL-34859);
# expand-rootfs.service does that afterwards.
growpart:
  mode: auto
  devices: ["/var"]
resize_rootfs: false
